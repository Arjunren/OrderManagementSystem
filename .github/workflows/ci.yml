name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: order_test, POSTGRES_USER: orderapp, POSTGRES_PASSWORD: order_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderapp -d order_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/order_test
      DATABASE_USERNAME: orderapp
      DATABASE_PASSWORD: order_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25', cache: maven }
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --update-snapshots verify
      - name: Verify PostgreSQL migration and application startup
        shell: bash
        run: |
          java -jar target/order-management-system-*.jar > application.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat application.log
          exit 1
