services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderapp
      POSTGRES_PASSWORD: orderapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderapp -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [order_data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/orderdb
      DATABASE_USERNAME: orderapp
      DATABASE_PASSWORD: orderapp
      ALLOWED_ORIGINS: http://localhost:3000
      SPRING_PROFILES_ACTIVE: dev
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  order_data: {}
